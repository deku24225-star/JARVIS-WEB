<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#050b14"><link rel="manifest" href="manifest.webmanifest"><title>JARVIS Web</title><link rel="stylesheet" href="style.css"></head><body>
<div class="app"><header><div><div class="brand">J A R V I S</div><div class="sub">PERSONAL AI // WEB CORE</div></div><div class="right"><span id="net">ONLINE</span><button id="settings">⚙</button></div></header>
<section class="hero"><div class="orb"><i></i><i></i><b></b></div><div><div id="state">READY</div><h1>Good to see you.</h1><p>Voice or text. Your command, my response.</p></div></section>
<section class="panel"><div id="chat"></div><div class="quick"><button data-c="What is the time?">TIME</button><button data-c="What's the weather?">WEATHER</button><button data-c="Search Google for ">SEARCH</button><button data-c="Open YouTube">YOUTUBE</button><button data-c="Open Maps">MAPS</button><button data-c="Tell me the date">DATE</button></div><div class="compose"><textarea id="input" placeholder="Speak or type a command…"></textarea><button id="mic">🎙</button><button id="send">➤</button></div><div class="controls"><button id="stop">STOP</button><button id="clear">CLEAR</button><button id="remember">REMEMBER</button></div></section>
<footer>JARVIS WEB CORE <span>AI PROPOSES · CORE DECIDES · USER AUTHORIZES</span></footer></div>
<dialog id="dlg"><h2>JARVIS SETTINGS</h2><label>Language<select id="lang"><option value="en-IN">English (India)</option><option value="hi-IN">Hindi (India)</option></select></label><label>Personality<select id="person"><option value="bestfriend">Male Best Friend</option><option value="professional">Professional</option><option value="calm">Calm</option></select></label><label><input id="voice" type="checkbox" checked> Speak replies aloud</label><label><input id="wake" type="checkbox"> Wake phrase mode</label><input id="phrase" placeholder="Wake phrase (e.g. Jarvis)"><button id="save">SAVE</button></dialog>
<dialog id="confirm"><h2>AUTHORIZATION REQUIRED</h2><p id="confirmText"></p><div class="actions"><button id="cancel">CANCEL</button><button id="authorize">AUTHORIZE</button></div></dialog>
<script src="app.js"></script><script>if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});</script></body></html>
